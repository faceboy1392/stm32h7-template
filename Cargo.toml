[package]
name = "stm32H753ZIT6-template"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.10", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.7"
defmt = "1.2.0"
defmt-rtt = "1.3.1"
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "defmt",
] }
embassy-stm32 = { version = "0.6.0", features = [
    "stm32h753zi",
    "defmt",
    "time-driver-any",
    "time",
] }
embassy-time = { version = "0.5.1", features = ["defmt-timestamp-uptime"] }
panic-probe = { version = "1.0", features = ["print-defmt"] }

[profile.release]
debug = 2
lto = "fat"
codegen-units = 1
